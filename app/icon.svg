<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Derinay mürekkep damgası — uygulama markasıyla aynı kimlik -->
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c2a25"/>
      <stop offset="100%" stop-color="#131210"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ink)"/>
  <!-- İnce çam halkası -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="#3f7c72" stroke-opacity="0.45" stroke-width="1.5"/>
  <!-- Serif italik D -->
  <text
    x="31"
    y="46"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-weight="600"
    font-size="40"
    fill="#faf5e9"
  >D</text>
  <!-- Altın nokta -->
  <circle cx="50" cy="14" r="5" fill="#c8a04b"/>
</svg>
