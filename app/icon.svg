<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Derinay orkide damgası — uygulama markasıyla aynı kimlik -->
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c2a25"/>
      <stop offset="100%" stop-color="#131210"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ink)"/>
  <!-- İnce çam halkası -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="#3f7c72" stroke-opacity="0.45" stroke-width="1.5"/>
  <!-- Beş yapraklı orkide -->
  <g fill="#faf5e9" transform="translate(32 33)">
    <g>
      <ellipse cx="0" cy="-15" rx="6.6" ry="13.6" opacity="0.94"/>
      <ellipse cx="0" cy="-15" rx="6.6" ry="13.6" opacity="0.94" transform="rotate(72)"/>
      <ellipse cx="0" cy="-15" rx="6.6" ry="13.6" opacity="0.94" transform="rotate(144)"/>
      <ellipse cx="0" cy="-15" rx="6.6" ry="13.6" opacity="0.94" transform="rotate(216)"/>
      <ellipse cx="0" cy="-15" rx="6.6" ry="13.6" opacity="0.94" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="6.2"/>
  </g>
  <!-- Altın nokta -->
  <circle cx="50" cy="14" r="5" fill="#c8a04b"/>
</svg>
